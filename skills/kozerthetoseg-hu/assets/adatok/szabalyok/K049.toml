dontes = "A skill a szöveg saját választását tartja meg, és azt egységesíti. Ha a szöveg nem dönt, hivatali levélben a nagybetűs „Ön”-t javasolja, mert a kisokos ezt írja elő, és a NAV is így ír a saját tanácsaiban."
