dontes = "A kettő nem ütközik: a fogalom megnevezése ismétlődhet és ismétlődjön is, a hosszú név vagy a már elmondott tartalom ismételgetése viszont felesleges. A skill a terminust nem cseréli szinonimára, a felesleges ismétlést kihúzza."
