azonosito = "K080"
cim = "Határozatlan kifejezés és ható ige nélkül a kiadó tevékenységéről"
csoport = "szo"
szabaly = "Ha azt írod le, mit tesz a szöveg kiadója (például hogyan kezeli az adatokat), kerüld a ható igét és a határozatlan szavakat (néhány, gyakran, lehetséges); ha mégis kell, indokold."
miert = "A „felhasználhatjuk” vagy a „néhány esetben” után az olvasó nem tudja, mi történik ténylegesen, így nem tud dönteni."
kerdes = "A kiadó saját tevékenységéről szóló részekben nincs indokolatlan ható ige és határozatlan szó?"
alkalmazasi_kor = "jogi"
allapot = "aktiv"
ellenorzes = "vegyes"
sulyossag = "kozepes"
forrasok = [
  "wp260-2018#010",
]

[[minta]]
leiras = "ható ige a kiadó tevékenységéről (jelölt)"
regex = "\\b[^\\W\\d_]+(?:hatja|heti|hatjuk|hetjük|hatják|hetik)\\b"

[pelda]
rossz = "Adatait esetenként harmadik félnek is átadhatjuk."
jo = "A szállítási címét átadjuk a futárszolgálatnak, hogy kézbesítse a csomagot. Más harmadik félnek nem adjuk át."
