[[elteres]]
forrasok = ["vilagos-beszed-kisokos-2025#027", "vilagos-beszed-kezikonyv-2025#065", "eu-pontos-fogalmazas-2013#022", "uveges-2026#003"]
leiras = "A Világos Beszéd kisokosa szerint egy mondat legfeljebb 15–20 szóból álljon, a kézikönyv szerint húsz szónál semmiképp se legyen hosszabb; az uniós útmutató ugyanezt átlagként adja meg. Üveges korpuszában a szakértők által közérthetőre átírt hivatali mondatok átlaga is 25 token fölött van."
dontes = "A skill az átlagot követi (15–20 szó), és a 20 szó feletti mondatot jelöltként mutatja, nem hibaként. Ok: jogi és hivatali szövegben egy pontos feltétel gyakran hosszabb mondatot kíván, és Üveges eredménye szerint a felszíni hossz önmagában nem dönti el az érthetőséget."
