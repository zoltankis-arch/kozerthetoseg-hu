# Közérthetőségi szótár: körülményes kifejezés és egyszerűbb megfelelője.
# A meres.py javaslatként jelzi a találatokat; az atiras forrásként használja.
# Mezők: kifejezes, regex (kis- és nagybetű nem számít), javaslat, szabaly,
# forrasok (leltártétel-azonosítók), mikor_nem (elhagyható: mikor ne cseréld).
# A mezők leírása: assets/schemas/szotar.schema.json

