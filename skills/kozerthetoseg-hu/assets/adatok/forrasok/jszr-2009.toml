oldal = "5. §"
tipus = "szabaly"
tartalom = "Az ismétlődő kifejezés helyett rövid megjelölés alkalmazható; az első előfordulásnál, „a továbbiakban:” formulával, zárójelben kell bevezetni, és nem lehet olyan kifejezés, amely máshol más jelentésű."
szabalyok = ["K040"]

[[tetel]]
