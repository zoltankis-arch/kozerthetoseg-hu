[[tetel]]
azonosito = "jszr-2009#003"
fejezet = "f01"
oldal = "4. § (1)–(2)"
tipus = "szabaly"
tartalom = "Ugyanazt a fogalmat vagy rendelkezést minden előfordulásnál ugyanúgy kell megfogalmazni; azonos tárgyra eltérő megfogalmazás csak eltérő tartalomnál állhat."
