fejezet = "f03"
oldal = "3. pont"
tipus = "hatter"
tartalom = "A Ket.-et többször, egymástól függetlenül módosították; 2014-ben a kormány új, radikálisan rövidebb kódexet kért, amit az ágazati szabályok kiszervezésével és a lényegi szabályokra szűkítéssel értek el. Szövegszintű kötöttség nélkül az új kódex egyszerűbben, akár új szavakkal fogalmazhatott."
kihagyva = "Kodifikációtörténet; szabályt nem ad."

