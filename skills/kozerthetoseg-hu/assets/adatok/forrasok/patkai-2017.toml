oldal = "4. pont"
tipus = "hatter"
tartalom = "Az Európa Tanács CM/Rec(2007)7 ajánlása (A jó közigazgatás kódexe) szerint a hatóság ügyleírásokat készít, a jogalkotás pedig legyen könnyen érthető és alkalmazható."
