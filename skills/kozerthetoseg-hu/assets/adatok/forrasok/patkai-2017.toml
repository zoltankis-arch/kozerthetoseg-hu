fejezet = "f02"
oldal = "2. pont"
tipus = "hatter"
tartalom = "A 2011-es népszámlálás szerint a 15 évnél idősebbek legnagyobb csoportja (48 százalék) nyolc osztályt végzett, érettségi nélkül; ezért az Ákr.-t úgy írták, hogy általános műveltséggel is érthető legyen."
szabalyok = ["K001"]

[[tetel]]
