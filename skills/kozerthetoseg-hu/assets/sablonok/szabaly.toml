# Egy szabály egy fájl. Minden KITÖLTENDŐ jelölést cserélj ki.
# A mezők leírása: assets/schemas/szabaly.schema.json

azonosito = "{{azonosito}}"
cim = "{{cim}}"
csoport = "{{csoport}}"
szabaly = "KITÖLTENDŐ: a szabály egy mondatban"
miert = "KITÖLTENDŐ: miért segít az olvasónak"
# Eldöntendő kérdés az ellenőrző listához; az igen válasz a megfelelés.
kerdes = "KITÖLTENDŐ: kérdés?"
alkalmazasi_kor = "{{kor}}"
allapot = "aktiv"
# gepi: a meres.py megbízhatóan jelzi; vegyes: jelöltet ad, olvasva kell dönteni; itelet: csak olvasva.
ellenorzes = "itelet"
# Alapértelmezett prioritás: magas, kozepes vagy alacsony.
sulyossag = "kozepes"
# Leltártétel-azonosítók; a tételeknél is erre a szabályra kell mutatni.
forrasok = []
kivetelek = []
# A meres.py mutatói, ha jelzik ezt a szabályt (pl. "mondathossz").
meres = []

# Gépi vagy vegyes szabálynál egyszerű keresőminta (regex), ha a beépített mérés nem fedi:
# [[minta]]
# leiras = "mit talál"
# regex = "\\bminta\\b"

[pelda]
# Saját példa, nem a forrás szövege.
rossz = "KITÖLTENDŐ"
jo = "KITÖLTENDŐ"

# Ha két forrás ellentmond egymásnak, vedd fel így:
# [[elteres]]
# forrasok = ["forras-a#001", "forras-b#004"]
# leiras = "Mit mond az egyik, mit a másik."
# dontes = "Mit követ a skill, és miért."
